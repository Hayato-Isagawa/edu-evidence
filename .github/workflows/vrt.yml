name: VRT

on:
  pull_request:
    branches: [main]
    paths:
      - "src/layouts/**"
      - "src/components/**"
      - "src/styles/**"
      # 描画に効くのに対象外だった経路。#432(h2 のサイズ変更)は src/pages
      # だけの変更だったため VRT が起動せず、見た目が変わるのにピクセル判定が
      # 走らなかった。
      #
      # コンテンツは src/content にあるので、これらを足しても記事の追記・
      # 修正では起動しない(直近 60 コミットで src/content 10 回に対し
      # src/pages 29 回)。
      - "src/pages/**"
      # 更新履歴は PR ごとに 1 行増える(rule 8)。VRT の対象ページからは外して
      # あるので(vrt/pages.spec.ts のコメント参照)、ここで走らせても得るものが
      # 無い。直近 60 コミットのうち 10 件が changelog だけの変更だった。
      - "!src/pages/changelog.astro"
      - "src/data/**"
      - "src/lib/**"
      - "src/plugins/**"
      - "astro.config.*"
      - "vrt/**"
      - "playwright.vrt.config.ts"
      - ".github/workflows/vrt.yml"
  workflow_dispatch:

concurrency:
  group: vrt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vrt:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Build PR branch
        run: npm run build

      - name: Stash PR build
        run: mv dist dist-pr

      - name: Build main (baseline)
        run: |
          git worktree add /tmp/evi-main origin/main
          npm --prefix /tmp/evi-main ci
          npm --prefix /tmp/evi-main run build
          mv /tmp/evi-main/dist dist-main

      - name: Capture baseline from main
        env:
          VRT_DIST: dist-main
        run: npx playwright test --config playwright.vrt.config.ts --update-snapshots

      - name: Compare PR against baseline
        env:
          VRT_DIST: dist-pr
        run: npx playwright test --config playwright.vrt.config.ts

      - name: Upload VRT report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vrt-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
